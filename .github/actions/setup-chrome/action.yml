name: Setup pinned Chrome for Testing
description: Install and verify the Chrome build used by SWM CDP checks

outputs:
  executable:
    description: Absolute Chrome executable path
    value: ${{ steps.install.outputs.executable }}
  version:
    description: Installed Chrome version
    value: ${{ steps.install.outputs.version }}

runs:
  using: composite
  steps:
    - id: install
      name: Install Chrome for Testing 150.0.7871.115
      shell: bash
      run: |
        version='150.0.7871.115'
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64)
            platform='linux64'
            sha256='1be2db033133c5e2dd1a4e8664bf67b19a61bcf6ed28d2b00f433b3f0b4f9585'
            executable_relative='chrome-linux64/chrome'
            ;;
          macOS/ARM64)
            platform='mac-arm64'
            sha256='c418e4a29046bb62e340dfd9479b329bdf53ddd14a127b1362444a1e1b734a48'
            executable_relative='chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing'
            ;;
          macOS/X64)
            platform='mac-x64'
            sha256='1ede6b48b674a0ac0189f77debbc9bca21881d129eefa30252060117df705cf7'
            executable_relative='chrome-mac-x64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing'
            ;;
          Windows/X64)
            platform='win64'
            sha256='90e0d112cb2f2743a7fd723f030c15b6421940be61dcbda7758563f821dd81da'
            executable_relative='chrome-win64/chrome.exe'
            ;;
          *)
            echo "Unsupported Chrome for Testing runner: $RUNNER_OS/$RUNNER_ARCH" >&2
            exit 1
            ;;
        esac

        url="https://storage.googleapis.com/chrome-for-testing-public/$version/$platform/chrome-$platform.zip"
        root="$RUNNER_TEMP/chrome-for-testing-$version-$platform"
        archive="$RUNNER_TEMP/chrome-for-testing-$version-$platform.zip"
        curl --fail --silent --show-error --location --retry 3 --retry-all-errors --retry-delay 2 "$url" --output "$archive"
        actual_sha256="$(node -e "const fs=require('node:fs');const crypto=require('node:crypto');const hash=crypto.createHash('sha256');hash.update(fs.readFileSync(process.argv[1]));process.stdout.write(hash.digest('hex'))" "$archive")"
        test "$actual_sha256" = "$sha256"
        if test "$RUNNER_OS" = 'Windows'; then
          archive_windows="$(cygpath -w "$archive")"
          root_windows="$(cygpath -w "$root")"
          powershell.exe -NoLogo -NoProfile -NonInteractive -Command "Expand-Archive -LiteralPath '$archive_windows' -DestinationPath '$root_windows' -Force"
        else
          unzip -q -o "$archive" -d "$root"
        fi
        executable="$root/$executable_relative"
        if test "$RUNNER_OS" != 'Windows'; then
          chmod +x "$executable"
        fi
        actual_version="$("$executable" --version)"
        test "$actual_version" = "Google Chrome for Testing $version"
        echo "$actual_version"
        if test "$RUNNER_OS" = 'Windows'; then
          executable="$(cygpath -w "$executable")"
        fi
        echo "executable=$executable" >> "$GITHUB_OUTPUT"
        echo "version=$version" >> "$GITHUB_OUTPUT"
